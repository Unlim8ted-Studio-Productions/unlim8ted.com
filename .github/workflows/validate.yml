name: Validate site and checkout
on:
  pull_request:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          token: ${{ secrets.BACKEND_READ_TOKEN || github.token }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci --ignore-scripts
      - run: npm ci --prefix backend/functions --ignore-scripts
      - run: npm test
      - run: npm run test:rules
      - name: Prepare generated site
        run: python tools/prepare_publish.py --output .site-preview
      - name: Generate pages and sitemap
        shell: pwsh
        run: ./tools/generate_product_pages_and_sitemap.ps1 -FrontendDir .site-preview
      - run: python tools/audit_site.py --frontend .site-preview --output tools/reports/site-audit.json --strict
      - run: npm run test:html
      - run: npm run test:syntax
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: site-validation-reports
          path: tools/reports/
